    <title>{% block title %}Lunchmeny{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

            <a href="{{ url_for('index') }}" class="logo">🍽️ Lunchmeny</a>
